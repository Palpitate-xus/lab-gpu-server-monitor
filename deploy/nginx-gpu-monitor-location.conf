# Include inside the existing TLS server block. More-specific application
# locations (for example, Jupyter user prefixes) continue to take precedence.
location = /api/auth/login {
    limit_req zone=gpumon_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8300;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}

location = /api/auth/login-json {
    limit_req zone=gpumon_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8300;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}

location / {
    limit_req zone=gpumon_api burst=60 nodelay;
    proxy_pass http://127.0.0.1:8300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite client input so application rate limiting receives one
    # authoritative address from this trusted direct proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
}
