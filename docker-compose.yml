services:
  gpu-monitor:
    build: .
    image: gpu-monitor:latest
    container_name: gpu-monitor
    restart: unless-stopped
    ports:
      - "8300:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # SECRET_KEY now lives in .env (gitignored); never commit real keys here.
      # SECRET_KEY: "change-me"
      INIT_ADMIN_USERNAME: "admin"
      INIT_ADMIN_PASSWORD: "admin123"
      POLL_INTERVAL_SECONDS: "60"
      # MySQL backend (local docker-mysql-1 on the docker bridge)
      DATABASE_URL: "mysql+pymysql://gpumon:gpumon_pass_2024@172.17.0.1:3306/gpu_monitor?charset=utf8mb4"
      TZ: "Asia/Shanghai"
