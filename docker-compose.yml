services:
  gpu-monitor:
    build: .
    image: gpu-monitor:latest
    container_name: gpu-monitor
    restart: unless-stopped
    ports:
      - "8300:8000"
    volumes:
      - ./data:/app/data
      - /home/xusheng/gpu_logs:/app/archives
    env_file:
      - .env
    environment:
      # SECRET_KEY now lives in .env (gitignored); never commit real keys here.
      # SECRET_KEY: "change-me"
      INIT_ADMIN_USERNAME: "admin"
      INIT_ADMIN_PASSWORD: "admin123"
      POLL_INTERVAL_SECONDS: "60"
      # Daily tar.gz export of metrics older than retention_days lands here
      # before deletion (host dir: /home/xusheng/gpu_logs).
      ARCHIVE_DIR: "/app/archives"
      # MySQL backend (local docker-mysql-1 on the docker bridge)
      # DATABASE_URL now assembled from .env (MYSQL_PASSWORD); never commit credentials.
      DATABASE_URL: "mysql+pymysql://gpumon:${MYSQL_PASSWORD}@172.17.0.1:3306/gpu_monitor?charset=utf8mb4"
      TZ: "Asia/Shanghai"
